# ==========================================
# General
# ==========================================
set-option -g prefix C-b
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g set-titles on
set-option -g status-left '[#S] '
set-option -g status-right '%H:%M  %d-%b-%Y'
set-option -g mouse on
set-option -g history-limit 50000
set-window-option -g mode-keys vi
set-option -g escape-time 10
set-option -g focus-events on
set-option -g display-time 2000
set-option -g default-command /bin/bash

# Reload config
bind-key R source-file ~/.config/tmux/tmux.conf \; \
    display-message 'tmux.conf reloaded'

# ==========================================
# Navigation
# ==========================================
bind-key -n M-Left  previous-window
bind-key -n M-Right next-window
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==========================================
# Dead pane handling
# ==========================================
set-window-option -g remain-on-exit on
bind-key e respawn-pane -k /bin/bash

# ==========================================
# Spring service commands
# ==========================================
# C-b s : start/restart service in current pane
bind-key s respawn-pane -k '/home/user/.local/bin/run-service.sh'

# Alt+s : stop current pane
bind-key -n M-s send-keys C-c

# Alt+x : stop ALL service panes (excludes devctl)
bind-key -n M-x run-shell 'tmux list-panes -s -t spring-microservices -F "##{pane_id} #{window_name}" | awk '"'"'$2 != "devctl" {print $1}'"'"' | while read -r pane; do tmux send-keys -t "$pane" C-c; done'

# Alt+y : restart ALL service panes in dependency order (excludes devctl)
bind-key -n M-y run-shell '$HOME/.local/bin/spring-dev.sh restart-all'

# C-b y : toggle synchronized panes
bind-key y set-window-option synchronize-panes \; display-message "sync: #{?synchronize-panes,on,off}"   
